<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家长端 · 四个一级页面总览</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #f3f1ec;
      --fg: #1a1916;
      --muted: #77736a;
      --border: rgba(26, 25, 22, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      min-height: 100vh;
      padding: 32px 36px 44px;
    }
    footer.overview {
      margin-top: 28px;
      text-align: center;
    }
    footer.overview h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    footer.overview p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    /* 外层负责横向滚动，内层负责排布：窗口变窄时出滚动条，而不是把手机框压小 */
    .board-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .board {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      justify-content: center;
      min-width: min-content;
    }
    .panel {
      width: 390px;
      flex-shrink: 0;
    }
    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .panel-head h2 {
      font-size: 15px;
      font-weight: 600;
    }
    .panel-head a {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1px;
    }
    .panel-head a:hover { color: var(--fg); }
    /* iframe 尺寸必须与内部手机页面(390×844)一致，否则会出现内部滚动条、底部 tab 被滚出视野 */
    .frame-fit iframe {
      display: block;
      width: 390px;
      height: 844px;
      border: 1px solid var(--border);
      border-radius: 40px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(26, 25, 22, 0.1);
    }
    @media (max-width: 900px) {
      .board { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="board-wrap">
  <main class="board" data-od-id="tab-board">
    <section class="panel" data-od-id="panel-home">
      <div class="panel-head"><h2>首页</h2><a href="screens/home.html">单独打开 ›</a></div>
      <div class="frame-fit"><iframe src="screens/home.html" title="首页"></iframe></div>
    </section>
    <section class="panel" data-od-id="panel-tasks">
      <div class="panel-head"><h2>家园共育</h2><a href="screens/home-school.html">单独打开 ›</a></div>
      <div class="frame-fit"><iframe src="screens/home-school.html" title="家园共育"></iframe></div>
    </section>
    <section class="panel" data-od-id="panel-moments">
      <div class="panel-head"><h2>在园时光</h2><a href="screens/kindergarten-moments.html">单独打开 ›</a></div>
      <div class="frame-fit"><iframe src="screens/kindergarten-moments.html" title="在园时光"></iframe></div>
    </section>
    <section class="panel" data-od-id="panel-profile">
      <div class="panel-head"><h2>儿童档案</h2><a href="screens/child-profile.html">单独打开 ›</a></div>
      <div class="frame-fit"><iframe src="screens/child-profile.html" title="儿童档案"></iframe></div>
    </section>
  </main>
  </div>
  <footer class="overview" data-od-id="overview-footer">
    <h1>化龙幼儿园 · 家长端</h1>
    <p>四个一级 Tab 页并排预览，点击页面标题旁「单独打开」可全屏查看。</p>
  </footer>
</body>
</html>
