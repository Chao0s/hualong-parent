<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>成长册</title><link rel="icon" href="data:," /><link rel="stylesheet" href="../assets/app.css" /></head>
<body>
  <main class="stage"><section class="phone">
    <div class="statusbar"><span>9:41</span><div class="status-icons"><span class="signal"></span><span class="signal"></span><span class="signal"></span><span class="battery"></span></div></div>
    <div class="app has-tabbar" data-growth-book>
      <header class="top">
        <a class="back" href="child-profile.html" data-dynamic-back data-book-back>‹</a>
        <div class="titleblock"><h1 data-book-title>成长册</h1><p data-book-term>小雨 · 中一班</p></div>
        <span class="status warn" data-book-status hidden>生成中</span>
      </header>

      <!-- 书架模式（默认）：一学期只有一本册子，素材征集阶段本学期的册子尚不存在，
           所以这里只列历史成长册 + 当前学期的素材征集入口（decision.md §11） -->
      <div data-book-shelf>
        <a class="card row" href="growth-book-materials.html" style="margin-bottom:4px;" data-material-entry>
          <div class="row-main"><span class="icon">征</span><div class="row-text"><h3>素材征集</h3><p>「第一天与最后一天」栏目 · 1 项待提交</p></div></div>
          <span class="dot-badge" aria-label="待办"></span>
        </a>
        <div class="section-title"><h2>历史成长册</h2></div>
        <a class="card row" href="growth-book.html?book=small-2">
          <div class="row-main"><span class="icon">册</span><div class="row-text"><h3>小班下学期成长册</h3><p>2025 春季学期 · 已生成</p></div></div>
          <span class="status done">可查看</span>
        </a>
        <a class="card row" href="growth-book.html?book=small-1">
          <div class="row-main"><span class="icon">册</span><div class="row-text"><h3>小班上学期成长册</h3><p>2024 秋季学期 · 已生成</p></div></div>
          <span class="status done">可查看</span>
        </a>
        <p class="small" style="margin-top:10px;">本学期（中班上学期）成长册将在素材征集与教师整理完成后生成，届时在此查看。</p>
      </div>

      <!-- 册内模式：?book= 指定历史册时渲染翻页书本（视觉对齐教师端 growth-book-sample.html） -->
      <div data-book-view hidden>
        <div class="book" data-book-pages></div>
        <div class="book-controls">
          <button class="nav-btn" type="button" data-book-prev aria-label="上一页">‹</button>
          <div class="page-indicator" data-book-indicator>1 / 1</div>
          <button class="nav-btn" type="button" data-book-next aria-label="下一页">›</button>
        </div>
        <p class="small" style="margin-top:10px;">点击书页或使用左右按钮翻页。</p>
      </div>
    </div>
    <nav class="tabbar" aria-label="底部导航">
      <a class="tab-item" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg>首页</a>
      <a class="tab-item" href="home-school.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17.5" rx="2.5"/><path d="m9 12.5 2.2 2.2 4.3-4.4"/></svg>家园共育</a>
      <a class="tab-item" href="kindergarten-moments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m5 17 4.2-4.2 3 3 3.4-3.4L21 17"/></svg>在园时光</a>
      <a class="tab-item on" href="child-profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20c1.6-3.8 4.6-5.2 7.2-5.2s5.6 1.4 7.2 5.2"/></svg>儿童档案</a>
    </nav>
  </section></main>
  <script src="../assets/app.js"></script>
