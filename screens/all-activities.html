<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全部活动</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="../assets/app.css" />
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="全部活动">
      <div class="statusbar"><span>9:41</span><div class="status-icons"><span class="signal"></span><span class="signal"></span><span class="signal"></span><span class="battery"></span></div></div>
      <div class="app has-tabbar">
        <header class="top">
          <a class="back" href="home-school.html" data-dynamic-back>‹</a>
          <div class="titleblock">
            <h1>全部活动</h1>
            <p>小雨 · 按提交时间倒序</p>
          </div>
        </header>

        <div class="segmented" data-filter-group>
          <button class="active" data-filter-target="all">全部</button>
          <button data-filter-target="daily">日常亲子任务</button>
          <button data-filter-target="community">社区任务</button>
        </div>

        <section class="list" data-activity-feed></section>

        <p class="small" style="margin-top:14px;">
          点卡片上的「加入成长册」可挑选要收录的照片，收录后进入成长册「亲子活动」栏目。
          教师挑选的同一条内容会自动合并，不会重复出现。
        </p>
      </div>
      <nav class="tabbar" aria-label="底部导航">
        <a class="tab-item" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.7V21h14V9.7"/></svg>首页</a>
        <a class="tab-item on" href="home-school.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17.5" rx="2.5"/><path d="m9 12.5 2.2 2.2 4.3-4.4"/></svg>家园共育</a>
        <a class="tab-item" href="kindergarten-moments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="10" r="1.6"/><path d="m5 17 4.2-4.2 3 3 3.4-3.4L21 17"/></svg>在园时光</a>
        <a class="tab-item" href="child-profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20c1.6-3.8 4.6-5.2 7.2-5.2s5.6 1.4 7.2 5.2"/></svg>儿童档案</a>
      </nav>
      <!-- 选片抽屉：一份，按点击的卡片动态填充；覆盖底部导航（z-index 20 > 15） -->
      <div class="sheet" data-pick-sheet hidden>
        <div class="sheet-backdrop" data-pick-close></div>
        <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="pick-sheet-title">
          <div class="sheet-head">
            <div>
              <h2 id="pick-sheet-title" data-pick-title>加入成长册</h2>
              <p>活动文字将全部收录；请选择要收录的照片（可多选）。</p>
            </div>
            <button class="icon-button" type="button" aria-label="关闭" data-pick-close>×</button>
          </div>
          <div class="photo-grid" data-pick-grid></div>
          <div class="actions">
            <button class="secondary" type="button" data-pick-close>取消</button>
            <button class="primary" type="button" data-pick-confirm>加入</button>
          </div>
        </section>
      </div>
    </section>
  </main>
  <script src="../assets/app.js"></script>
</body>
</html>
