<body>
  <main class="stage"><section class="phone" aria-label="素材征集">
    <div class="statusbar"><span>9:41</span><div class="status-icons"><span class="signal"></span><span class="signal"></span><span class="signal"></span><span class="battery"></span></div></div>
    <div class="app has-tabbar">
      <header class="top">
        <a class="back" href="growth-book.html">‹</a>
        <div class="titleblock"><h1>素材征集</h1><p>中班上学期成长册 · 小雨</p></div>
      </header>

      <!-- 待提交永远是第一个分组：它是本页的首要工作 -->
      <div class="section-title"><h2>待提交</h2></div>
      <a class="card row" href="growth-book-material-submit.html?section=first-last-day">
        <div class="row-main"><span class="icon">征</span><div class="row-text"><h3>第一天与最后一天</h3><p>4 张照片 + 2 段文字 · 已交 0/6</p></div></div>
        <span class="status warn">待提交</span>
      </a>

      <div class="section-title"><h2>已交齐</h2></div>
      <a class="card row" href="growth-book-material-submit.html?section=new-year-wish">
        <div class="row-main"><span class="icon">册</span><div class="row-text"><h3>新年心愿</h3><p>已交 2/2 · 其中 1 项由教师代传</p></div></div>
        <span class="status done">已交齐</span>
      </a>
      <!-- 撤回态（decision.md §3）：撤回删除提交，此处只留标记；教师重新发布后回到上方待提交 -->
      <div class="card row">
        <div class="row-main"><span class="icon">册</span><div class="row-text"><h3>新春成长瞬间</h3><p>征集已撤回 · 此前提交已删除，重新发布后需再次提交</p></div></div>
        <span class="status todo">已撤回</span>
      </div>

      <p class="small" style="margin-top:10px;">
        每个栏目的全部槽位交齐才算完成，缺件不被接受；未交的槽位教师可代为上传。
        素材征集不设截止日期，以学期结束为自然边界。
      </p>
    </div>
